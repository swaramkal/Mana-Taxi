<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1115"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="css/style.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><title>My rides · MANA TAXI</title></head><body>
<header class="nav"><a class="logo" href="index.html"><span class="logo-mark">M</span><b>MANA TAXI</b></a><div class="navr"><button id="themeBtn" class="icon" aria-label="Toggle theme">◐</button><span id="navAuth"></span></div></header>
<main class="wrap" style="padding-bottom:50px"><h2 style="margin-top:20px" id="hello">Customer dashboard</h2>
<div class="tabs"><button class="tab on" data-p="pBook">Book</button><button class="tab" data-p="pRide">My ride</button><button class="tab" data-p="pHist">History</button><button class="tab" data-p="pProf">Profile</button><button class="tab" data-p="pSup">Support</button></div>
<section id="pBook" class="pane on card"><div id="bookingRoot"><div class="empty"><span class="spin"></span></div></div></section>
<section id="pRide" class="pane"><div id="rideBox" class="card"></div><div id="trkMap" class="map" style="margin-top:12px;min-height:300px;height:300px" hidden></div></section>
<section id="pHist" class="pane card"><div class="tw" id="histBox"></div></section>
<section id="pProf" class="pane card" style="max-width:520px"><h3>Edit profile</h3><label for="pN">Full name</label><input id="pN"><label for="pM">Mobile</label><input id="pM" maxlength="10"><label>Email</label><input id="pE" disabled><p><button class="btn gold" id="pSave">Save changes</button></p></section>
<section id="pSup" class="pane"><div class="card" style="max-width:620px"><h3>Customer support</h3><label for="sS">Subject</label><input id="sS" maxlength="100"><label for="sM">Message</label><textarea id="sM" rows="4" maxlength="1000"></textarea><p><button class="btn gold" id="sSend">Send request</button></p></div><div class="card" style="margin-top:12px"><h3>My requests</h3><div id="supBox" class="muted">None yet.</div></div></section>
</main><script type="module" src="js/customer.js"></script></body></html>
